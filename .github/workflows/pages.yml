name: Pages
# Publishes dist/index.html to GitHub Pages on every push to main, but only once the repository is public.
# Before the first run: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the data version carries the date of the last topics/ change
      - name: Content check
        run: python3 tools/leak_check.py
      - name: Build
        run: python3 tools/build.py && mkdir site && cp dist/index.html dist/sw.js dist/manifest.webmanifest dist/icon.svg dist/questions.json site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
