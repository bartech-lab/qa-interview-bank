name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - name: Content check (personal-history patterns)
        run: python3 tools/leak_check.py
      - run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build and browser tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: qa-interview-bank
          path: dist/qa-interview-bank.zip
          retention-days: 30
