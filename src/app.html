<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Interview Bank</title>
<style>
  :root {
    --bg:#f6f7f9; --fg:#1b1d22; --muted:#667085; --card:#fff; --line:#e4e7ec; --soft:#f1f3f6;
    --acc:#4f46e5; --acc-soft:#eef2ff; --ok:#16a34a; --ok-soft:#dcfce7; --bad:#dc2626; --bad-soft:#fee2e2;
    --warn:#b45309; --warn-soft:#fef3c7; --core:#4f46e5; --std:#0891b2; --niche:#64748b;
    --code-bg:#0f172a; --code-fg:#e2e8f0; --shadow:0 1px 2px rgba(16,24,40,.06), 0 4px 16px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#0e1015; --fg:#e6e8ec; --muted:#98a2b3; --card:#171a21; --line:#272b35; --soft:#1e222b;
    --acc:#818cf8; --acc-soft:#1e1b4b; --ok:#4ade80; --ok-soft:#14321f; --bad:#f87171; --bad-soft:#3b1515;
    --warn:#fbbf24; --warn-soft:#3a2a0b; --core:#818cf8; --std:#22d3ee; --niche:#94a3b8;
    --code-bg:#0a0c10; --code-fg:#e2e8f0; --shadow:none; } }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font:16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); -webkit-font-smoothing:antialiased; }
  button, input, select { font:inherit; color:inherit; }
  button { cursor:pointer; }
  a { color:var(--acc); }
  .hidden { display:none !important; }
  .muted { color:var(--muted); }
  .small { font-size:14px; }

  /* top bar */
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:16px; padding:10px 20px; background:color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .logo { font-weight:700; font-size:17px; display:flex; align-items:center; gap:8px; cursor:pointer; white-space:nowrap; }
  .logo span { font-size:22px; }
  .seg { display:inline-flex; background:var(--soft); border-radius:10px; padding:3px; }
  .seg button { border:0; background:none; padding:6px 16px; border-radius:8px; font-weight:500; color:var(--muted); }
  .seg button.on { background:var(--card); color:var(--fg); box-shadow:var(--shadow); }
  .grow { flex:1; }
  .resetrow { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px; margin:28px 0 8px; font-size:14px; }
  .overall { display:flex; align-items:center; gap:10px; font-size:14px; color:var(--muted); white-space:nowrap; }
  .meter { width:120px; height:6px; background:var(--soft); border-radius:99px; overflow:hidden; display:block; }
  .meter i { display:block; height:100%; background:var(--ok); border-radius:99px; transition:width .3s; }

  /* shared bits */
  .wrap { max-width:1080px; margin:0 auto; padding:32px 20px 80px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); }
  .btn { border:1px solid var(--line); background:var(--card); padding:9px 18px; border-radius:10px; font-weight:500; }
  .btn:hover { border-color:var(--muted); }
  .btn.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  .btn:disabled { opacity:.4; cursor:default; }
  .kbd { font:12px ui-monospace, monospace; border:1px solid currentColor; border-bottom-width:2px; border-radius:5px; padding:0 5px; margin-left:6px; opacity:.6; }
  .tier { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:2px 9px; border-radius:99px; letter-spacing:.02em; }
  .tier::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .tier.Core { color:var(--core); background:color-mix(in srgb, var(--core) 12%, transparent); }
  .tier.Standard { color:var(--std); background:color-mix(in srgb, var(--std) 12%, transparent); }
  .tier.Niche { color:var(--niche); background:color-mix(in srgb, var(--niche) 14%, transparent); }
  .chip { border:1px solid var(--line); background:var(--card); border-radius:99px; padding:6px 14px; font-size:14px; display:inline-flex; gap:6px; align-items:center; }
  .chip.on { border-color:var(--acc); background:var(--acc-soft); color:var(--acc); font-weight:600; }
  .switch { display:inline-flex; align-items:center; gap:8px; font-size:14px; cursor:pointer; user-select:none; }
  .switch input { appearance:none; width:34px; height:20px; border-radius:99px; background:var(--line); position:relative; cursor:pointer; transition:.2s; margin:0; flex:none; }
  .switch input::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked { background:var(--acc); } .switch input:checked::after { left:16px; }
  .info { position:relative; display:inline-flex; width:18px; height:18px; border-radius:50%; border:1px solid var(--muted); color:var(--muted); font-size:12px; font-weight:700; align-items:center; justify-content:center; cursor:help; text-transform:none; letter-spacing:0; }
  .info .tip { display:none; position:absolute; top:26px; left:-20px; width:310px; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:12px; padding:14px 16px; font-weight:400; font-size:14px; line-height:1.5; box-shadow:0 8px 30px rgba(0,0,0,.18); z-index:20; text-align:left; }
  .info:hover .tip, .info:focus .tip { display:block; }
  .tip p { margin:8px 0 0; }

  /* home */
  .hero h1 { font-size:30px; line-height:1.2; margin:0 0 8px; letter-spacing:-.01em; }
  .hero { text-align:center; }
  .hero p { margin:0 auto; color:var(--muted); max-width:64ch; }
  .tiers { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin:28px 0 32px; }
  .tiers .card { padding:16px 18px; }
  .tiers b { display:block; margin:8px 0 2px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:14px; }
  .topic { padding:18px; text-align:left; transition:transform .12s, border-color .12s; display:flex; flex-direction:column; gap:6px; }
  .topic:hover { transform:translateY(-2px); border-color:var(--acc); }
  .topic .ico { font-size:28px; }
  .topic .name { font-weight:650; font-size:16px; }
  .topic .meter { width:100%; margin-top:8px; }

  /* learn */
  #learn { display:grid; grid-template-columns:330px 1fr; height:calc(100vh - 57px); }
  #side { border-right:1px solid var(--line); overflow:auto; background:var(--card); }
  .side-head { position:sticky; top:0; background:var(--card); padding:16px 16px 12px; border-bottom:1px solid var(--line); z-index:1; display:flex; flex-direction:column; gap:10px; }
  .back { border:0; background:none; padding:0; color:var(--muted); font-size:14px; text-align:left; }
  .side-title { font-weight:700; font-size:17px; display:flex; gap:8px; align-items:center; }
  .search { width:100%; border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:8px 12px; }
  #side details { border-bottom:1px solid var(--line); }
  #side summary { list-style:none; padding:12px 16px; font-weight:600; font-size:14px; display:flex; gap:8px; align-items:baseline; cursor:pointer; }
  #side summary::-webkit-details-marker { display:none; }
  #side summary::before { content:"›"; color:var(--muted); transition:transform .15s; display:inline-block; width:10px; flex:none; }
  #side details[open] summary::before { transform:rotate(90deg); }
  #side summary .n { margin-left:auto; color:var(--muted); font-weight:400; font-size:13px; white-space:nowrap; }
  .qlink { display:flex; gap:10px; padding:7px 16px 7px 34px; font-size:14px; line-height:1.4; cursor:pointer; }
  .qlink:hover { background:var(--soft); }
  .qlink.on { background:var(--acc-soft); color:var(--acc); font-weight:500; box-shadow:inset 3px 0 0 var(--acc); }
  .qlink .dot { flex:none; width:8px; height:8px; margin-top:6px; border-radius:50%; border:1.5px solid var(--muted); opacity:.6; }
  .qlink .dot.done { background:var(--ok); border-color:var(--ok); opacity:1; }
  .qlink code { font-size:.88em; }
  #reader { overflow:auto; }
  .article { max-width:780px; margin:0 auto; padding:36px 32px 120px; }
  .crumbs { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px; color:var(--muted); margin-bottom:10px; }
  .article h2, .qcard h2 { font-size:26px; line-height:1.3; margin:0 0 22px; letter-spacing:-.01em; }

  /* answer blocks */
  .say { background:var(--acc-soft); border-radius:14px; padding:18px 22px; margin-bottom:14px; }
  .say .lbl { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--acc); margin-bottom:6px; }
  .say .lead { font-weight:600; font-size:17px; margin-bottom:8px; }
  .say p { margin:8px 0 0; }
  .block { border:1px solid var(--line); border-radius:14px; margin-bottom:12px; background:var(--card); }
  .block > summary { list-style:none; cursor:pointer; padding:14px 18px; font-weight:600; display:flex; gap:10px; align-items:center; }
  .block > summary::-webkit-details-marker { display:none; }
  .block > summary::after { content:"＋"; margin-left:auto; color:var(--muted); font-weight:400; }
  .block[open] > summary::after { content:"－"; }
  .block > summary .hint { color:var(--muted); font-weight:400; font-size:14px; }
  .block .inner { padding:0 20px 16px; }
  .trap { background:var(--warn-soft); border-radius:14px; padding:14px 18px; margin-bottom:12px; }
  .trap .lbl { font-weight:700; color:var(--warn); margin-bottom:4px; }
  .trap p:last-child { margin-bottom:0; }
  .fu { padding:12px 0; border-top:1px solid var(--line); } .fu:first-child { border-top:0; padding-top:0; }
  .fu .fq { font-weight:600; margin-bottom:4px; }
  .sources { font-size:13px; color:var(--muted); margin-top:20px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .report { margin-top:14px; }
  .sources a { text-decoration:none; border:1px solid var(--line); border-radius:99px; padding:3px 10px; }
  .body p { margin:0 0 12px; }
  .body ol, .body ul { padding-left:22px; margin:0 0 12px; } .body li { margin:5px 0; }
  .body code { font:0.88em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background:var(--soft); padding:1px 6px; border-radius:6px; }
  .say code { background:color-mix(in srgb, var(--card) 70%, transparent); }
  .body pre { background:var(--code-bg); color:var(--code-fg); padding:16px 18px; border-radius:12px; font:13.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space:pre-wrap; word-break:break-word; margin:0 0 14px; }
  .body pre code { background:none; padding:0; color:inherit; font:inherit; }
  .body pre .c { color:#86efac; opacity:.85; }
  .body table { border-collapse:collapse; margin:0 0 14px; font-size:14px; width:100%; }
  .body th, .body td { border-bottom:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
  .body th { font-weight:600; background:var(--soft); }
  .navrow { display:flex; gap:10px; align-items:center; margin-top:28px; padding-top:20px; border-top:1px solid var(--line); }
  .known-btn.on { background:var(--ok-soft); border-color:var(--ok); color:var(--ok); }

  /* quiz */
  .setup { max-width:720px; margin:0 auto; padding:28px; }
  .setup h2 { margin:0 0 4px; font-size:24px; }
  .setup h3 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:26px 0 10px; display:flex; gap:8px; align-items:center; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .startrow { display:flex; align-items:center; gap:16px; margin-top:28px; }
  .qstage { max-width:780px; margin:0 auto; padding:24px 20px 140px; }
  .qtop { display:flex; align-items:center; gap:12px; margin-bottom:14px; font-size:14px; color:var(--muted); }
  .qtop .meter { flex:1; width:auto; } .qtop .meter i { background:var(--acc); }
  .qcard { padding:32px 34px; min-height:300px; }
  .editor { margin-top:4px; }
  .editor textarea { display:block; width:100%; min-height:300px; box-sizing:border-box; background:var(--code-bg); color:var(--code-fg); caret-color:var(--code-fg); font:13.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding:16px 18px; border-radius:12px; border:1px solid var(--line); resize:vertical; tab-size:2; white-space:pre; overflow:auto; }
  .editor textarea:focus { outline:2px solid var(--acc); outline-offset:1px; }
  .edbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:10px; }
  .edbar .btn { padding:7px 14px; font-size:14px; }
  .edbar .clock { font-variant-numeric:tabular-nums; font-weight:600; }
  .edbar .clock:empty { display:none; }
  .edbar .clock.over { color:var(--bad); }
  .cmp { margin-top:14px; }
  .reveal { text-align:center; padding:30px 0 6px; }
  .reveal p { margin:0 0 16px; }
  .rate { position:fixed; left:0; right:0; bottom:0; padding:14px 20px calc(14px + env(safe-area-inset-bottom)); background:color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter:blur(8px); border-top:1px solid var(--line); display:flex; justify-content:center; gap:14px; }
  .rate .btn { min-width:210px; padding:13px 20px; font-size:16px; border-radius:12px; }
  .rate .miss, .resetrow .miss { background:var(--bad-soft); border-color:transparent; color:var(--bad); }
  .rate .hit { background:var(--ok-soft); border-color:transparent; color:var(--ok); }
  .summary { text-align:center; padding:40px 28px; }
  .summary .big { font-size:48px; }
  .stats3 { display:flex; justify-content:center; gap:36px; margin:20px 0 26px; }
  .stats3 b { display:block; font-size:28px; }
  .missed { text-align:left; max-width:560px; margin:0 auto 24px; padding:0; list-style:none; }
  .missed li { padding:8px 0; border-top:1px solid var(--line); font-size:15px; }

  @media (max-width:860px) {
    #learn { grid-template-columns:1fr; height:auto; } #side { max-height:45vh; border-right:0; border-bottom:1px solid var(--line); }
    .tiers { grid-template-columns:1fr; } .article { padding:24px 18px 100px; } .overall .meter { display:none; }
    .qcard { padding:22px 20px; } .rate .btn { min-width:0; flex:1; } header { gap:10px; padding:10px 12px; } .logo { font-size:0; }
  }
</style>
</head>
<body>
<header>
  <div class="logo" onclick="go('home')"><span>🎯</span> QA Interview Bank</div>
  <div class="seg">
    <button id="tab-learn" class="on" onclick="go('home')">📖 Learn</button>
    <button id="tab-quiz" onclick="go('setup')">⚡ Quiz</button>
  </div>
  <div class="grow"></div>
  <div class="overall" title="Questions you marked as known. Saved in this browser only."><span id="ov-text"></span><span class="meter"><i id="ov-bar"></i></span></div>
</header>

<div id="home" class="wrap"></div>
<div id="learn" class="hidden"><nav id="side"></nav><main id="reader"></main></div>
<div id="quiz" class="hidden"></div>

<script id="data" type="application/json">/*DATA*/</script>
<script>
// ---------- data ----------
const Q = JSON.parse(document.getElementById('data').textContent);
const META = {
  '01-playwright': ['🎭', 'Playwright'], '02-typescript-javascript': ['🟦', 'TypeScript & JavaScript'],
  '03-api': ['🔌', 'API testing'], '04-sql-databases': ['🗄️', 'SQL & databases'],
  '05-testing-fundamentals': ['🧪', 'Testing fundamentals'], '06-framework-and-flaky': ['🏗️', 'Framework design & flaky tests'],
  '07-ci-docker-cloud': ['🚀', 'CI/CD, Docker & Git'], '08-ai-testing-and-tools': ['🤖', 'AI in QA'],
  '09-mobile': ['📱', 'Mobile testing'], '10-performance-security-a11y': ['🛡️', 'Performance, security & a11y'],
  '11-agile-leadership': ['🧭', 'Agile & leadership'], '13-live-coding': ['⌨️', 'Live coding & home tasks'],
};
const TIERS = {
  Core: 'The topic appears in 30% or more of the QA job ads this bank was built from, or it is set to Core by hand. Only the first 5 questions of each such topic are Core; the rest are Standard.',
  Standard: 'Comes up often: in 10 to 30% of those job ads. Learn it after Core.',
  Niche: 'Rare: under 10% of the ads. Read it only when a job ad names the topic.',
};
const fileMeta = f => META[f] || ['📄', f];
Q.forEach((q, i) => {
  q.i = i; q.k = q.id;  // stable id from the Markdown, so saved progress survives edits
  q.tier = (q.body.match(/^Topic: .*?\| (Core|Standard|Niche)/m) || [])[1] || 'Niche';
  q.sec = (q.section || 'General').replace(/^Section \d+:\s*/i, '').replace(/\s*\(`?[\w-]+`?\)$/, '');
  q.f = fields(q.body);
});
const files = [...new Set(Q.map(q => q.file))];
let store = { known: {} };
try { store = Object.assign(store, JSON.parse(localStorage.getItem('qa-bank') || '{}')); } catch (e) {}
store.code = store.code || {};
// Progress saved by versions before ids was keyed by file and question text: move it to the id.
Q.forEach(q => { const old = q.file + '|' + q.q;
  if (store.known[old]) { store.known[q.k] = 1; delete store.known[old]; }
  if (old in store.code) { store.code[q.k] = store.code[old]; delete store.code[old]; } });
const save = () => { try { localStorage.setItem('qa-bank', JSON.stringify(store)); } catch (e) {} };
const known = q => !!store.known[q.k];
const $ = id => document.getElementById(id);

// ---------- markdown ----------
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function inline(s) {
  const codes = [];
  s = esc(s).replace(/`([^`]+)`/g, (_, c) => (codes.push(c), `\u0000${codes.length - 1}\u0000`));
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[\s(])\*([^*\s][^*]*?)\*/g, '$1<i>$2</i>')
       .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
       .replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}
const LIST = /^\s*([-*]|\d+\.) /;
function md(text) {
  const out = [], L = text.split('\n'); let i = 0;
  while (i < L.length) {
    const l = L[i];
    if (/^\s*```/.test(l)) { const b = []; i++; while (i < L.length && !/^\s*```/.test(L[i])) b.push(L[i++]); i++;
      out.push(`<pre><code>${esc(b.join('\n')).replace(/(^|\s)(\/\/.*|#\s.*|--\s.*)$/gm, '$1<span class="c">$2</span>')}</code></pre>`); continue; }
    if (/^\|/.test(l)) { const rows = []; while (i < L.length && /^\|/.test(L[i])) rows.push(L[i++]);
      out.push('<table>' + rows.filter(r => !/^\|[\s:|-]+\|$/.test(r)).map((r, n) => '<tr>' + r.replace(/^\||\|$/g, '').split('|')
        .map(c => `<${n ? 'td' : 'th'}>${inline(c.trim())}</${n ? 'td' : 'th'}>`).join('') + '</tr>').join('') + '</table>'); continue; }
    if (LIST.test(l)) { const ol = /^\s*\d+\./.test(l), items = [];
      while (i < L.length && LIST.test(L[i])) { let it = L[i++].replace(LIST, '');
        while (i < L.length && /^\s{2,}\S/.test(L[i]) && !LIST.test(L[i])) it += ' ' + L[i++].trim();
        items.push(`<li>${inline(it)}</li>`); }
      out.push(`<${ol ? 'ol' : 'ul'}>${items.join('')}</${ol ? 'ol' : 'ul'}>`); continue; }
    if (/^#{2,6} /.test(l)) { out.push(`<p><b>${inline(l.replace(/^#+ /, ''))}</b></p>`); i++; continue; }
    if (!l.trim()) { i++; continue; }
    const p = []; while (i < L.length && L[i].trim() && !/^(\s*```|\||\s*([-*]|\d+\.) |#{2,6} )/.test(L[i])) p.push(L[i++]);
    out.push(`<p>${inline(p.join(' '))}</p>`);
  }
  return out.join('\n');
}

// ---------- answer layout ----------
function fields(body) {
  const f = {}, marks = [...body.matchAll(/^\*\*(Starter|What you receive|Say|In the slot|Full process|Follow-ups|Trap|Source):\*\*/gm)];
  f.extra = (marks.length ? body.slice(0, marks[0].index) : body).replace(/^Topic: .*$/m, '').trim();
  marks.forEach((m, n) => f[m[1]] = body.slice(m.index + m[0].length, n + 1 < marks.length ? marks[n + 1].index : undefined).trim());
  return f;
}
// One sentence. A . ! ? ends it only when a space and a non-lowercase character follow, so "in..." and, "Node.js" and "1.65" stay inside.
const SENTENCE = /(?:`[^`]*`|`|[^.!?`]|[.!?](?![.!?]*["')]*(?:\s+[^a-z]|\s*$)))+(?:[.!?]+["')]*|$)\s*|[.!?]+["')]*\s*/g;
// Short answer: first sentence as a bold lead, the rest as short paragraphs of two sentences each.
function sayHtml(say) {
  if (!say) return '';
  if (/```|^\s*([-*]|\d+\.) /m.test(say)) return `<div class="say"><div class="lbl">Short answer</div>${md(say)}</div>`;
  const s = say.replace(/\s+/g, ' ').match(SENTENCE) || [say];
  const lead = s.shift(), paras = [];
  for (let i = 0; i < s.length; i += 2) paras.push(s.slice(i, i + 2).join(''));
  return `<div class="say"><div class="lbl">Short answer</div><div class="lead">${inline(lead.trim())}</div>${paras.filter(p => p.trim()).map(p => `<p>${inline(p.trim())}</p>`).join('')}</div>`;
}
function followUps(t) {
  return t.split(/\n(?=\s*- )/).map(x => x.replace(/^\s*- /, '').trim()).filter(Boolean).map(x => {
    const m = x.match(/^\*([^*]+)\*\s*([\s\S]*)$/);
    return m ? `<div class="fu"><div class="fq">${inline(m[1])}</div><div>${inline(m[2])}</div></div>` : `<div class="fu">${inline(x)}</div>`;
  }).join('');
}
function sources(t) {
  const urls = t.match(/https?:\/\/[^\s)>,]+/g) || [];
  const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } };
  return urls.length ? `<div class="sources">📚 Sources ${urls.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(host(u))}</a>`).join('')}</div>` : '';
}
// What the candidate gets before answering: starter code or the home task materials. Shown with the question.
function given(q) {
  const f = q.f, g = f.Starter || f['What you receive'];
  if (!g) return '';
  const code = starterCode(q);
  if (code === null) return `<div class="body"><div class="say"><div class="lbl">${f.Starter ? '📄 Starter code' : '📦 What you receive'}</div>${md(g)}</div></div>`;
  const intro = g.slice(0, g.indexOf('```')).trim(), min = taskMinutes(q);
  return `<div class="body"><div class="say"><div class="lbl">⌨️ Your editor</div>${md(intro)}
    <div class="editor"><textarea class="ed" spellcheck="false" autocapitalize="off" autocomplete="off" oninput="edSave(${q.i}, this.value)" onkeydown="edKey(event, ${q.i})">${esc(store.code[q.k] ?? code)}</textarea>
    <div class="edbar">${min ? `<button class="btn tb" data-i="${q.i}" onclick="timerToggle(${q.i})">${timers[q.i] ? '■ Stop' : `▶ Start ${min} min timer`}</button><span class="clock" data-i="${q.i}"></span>` : ''}
      <button class="btn" onclick="compare(this, ${q.i})">Compare with the answer</button><button class="btn" onclick="edReset(this, ${q.i})">Reset to starter</button></div>
    <div class="cmp"></div></div></div></div>`;
}
// ---------- editor: a plain typing box, like an interview tool. It does not run code. ----------
function starterCode(q) {
  const m = (q.f.Starter || '').match(/```\w*\n([\s\S]*?)```/);
  return m ? m[1].replace(/\n$/, '') : null;
}
function taskMinutes(q) { const m = q.q.match(/(\d+) min\b/); return m ? +m[1] : 0; }
function edSave(i, value) { store.code[Q[i].k] = value; save(); }
function edKey(e, i) {
  if (e.key !== 'Tab' || e.shiftKey) return;
  e.preventDefault();
  e.target.setRangeText('  ', e.target.selectionStart, e.target.selectionEnd, 'end');
  edSave(i, e.target.value);
}
function edReset(btn, i) {
  delete store.code[Q[i].k]; save();
  btn.closest('.editor').querySelector('.ed').value = starterCode(Q[i]);
}
function compare(btn, i) {
  const box = btn.closest('.editor').querySelector('.cmp'), f = Q[i].f;
  if (box.innerHTML) { box.innerHTML = ''; return; }
  const full = (f['Full process'] || '').match(/```\w*\n[\s\S]*?```/g);
  const ans = f['In the slot'] || (full ? full[full.length - 1] : '');
  box.innerHTML = `<div class="lbl">${f['In the slot'] ? '⏱️ Enough for the time limit' : '✅ Worked solution'}</div>${md(ans)}`;
}
const timers = {};
function timerTick(i) {
  if (!timers[i]) return;
  const left = Math.round((timers[i] - Date.now()) / 1000), s = Math.abs(left);
  document.querySelectorAll(`.clock[data-i="${i}"]`).forEach(el => {
    el.textContent = (left < 0 ? '+' : '') + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    el.classList.toggle('over', left < 0);
  });
}
function timerToggle(i) {
  const label = text => document.querySelectorAll(`.tb[data-i="${i}"]`).forEach(b => { b.textContent = text; });
  if (timers[i]) {
    clearInterval(timers[i + 'id']); delete timers[i]; delete timers[i + 'id'];
    document.querySelectorAll(`.clock[data-i="${i}"]`).forEach(el => { el.textContent = ''; });
    label(`▶ Start ${taskMinutes(Q[i])} min timer`); return;
  }
  timers[i] = Date.now() + taskMinutes(Q[i]) * 60000;
  timers[i + 'id'] = setInterval(() => timerTick(i), 500); timerTick(i);
  label('■ Stop');
}
// "Report a problem" opens a prefilled GitHub issue; the id keeps the report attached to the question after edits.
const REPO = 'https://github.com/bartech-lab/qa-interview-bank';
function report(q) {
  const title = `[${q.id}] ${q.q}`.slice(0, 200);
  const body = `Question: ${q.q}\nId: ${q.id}\nTopic file: ${q.file}\n\nWhat is wrong or out of date:\n\nSource that shows it (link):\n`;
  return `<p class="report small"><a href="${REPO}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}" target="_blank" rel="noopener">Report a problem with this answer</a> <span class="muted">· ${esc(q.id)}</span></p>`;
}
function answer(q) {
  const f = q.f, fu = f['Follow-ups'] ? (f['Follow-ups'].match(/^\s*- /gm) || []).length : 0;
  return `<div class="body">${f.extra ? md(f.extra) : ''}${sayHtml(f.Say)}
    ${f['In the slot'] ? `<div class="say"><div class="lbl">⏱️ Enough for the time limit</div>${md(f['In the slot'])}</div>` : ''}
    ${f.Trap ? `<div class="trap"><div class="lbl">⚠️ Common trap</div>${md(f.Trap)}</div>` : ''}
    ${f['Full process'] ? `<details class="block"><summary>🛠️ Full explanation <span class="hint">steps and code</span></summary><div class="inner">${md(f['Full process'])}</div></details>` : ''}
    ${fu ? `<details class="block"><summary>💬 Follow-up questions <span class="hint">${fu} the interviewer may ask next</span></summary><div class="inner">${followUps(f['Follow-ups'])}</div></details>` : ''}
    ${f.Source ? sources(f.Source) : ''}${report(q)}</div>`;
}
const tierBadge = t => `<span class="tier ${t}" title="${esc(TIERS[t])}">${t}</span>`;
const crumbs = q => `<div class="crumbs">${tierBadge(q.tier)}<span>${fileMeta(q.file)[0]} ${esc(fileMeta(q.file)[1])}</span><span>·</span><span>${inline(q.sec)}</span></div>`;
const infoTiers = () => `<span class="info" tabindex="0">?<span class="tip"><b>What do Core, Standard and Niche mean?</b>${Object.entries(TIERS).map(([n, d]) => `<p>${tierBadge(n)} ${d}</p>`).join('')}</span></span>`;

function overall() {
  const n = Q.filter(known).length;
  $('ov-text').textContent = `${n} / ${Q.length} known`; $('ov-bar').style.width = (100 * n / Q.length) + '%';
}

// ---------- navigation ----------
let view = 'home', topic = null, current = null;
const filter = { text: '', core: false };
function go(v, arg) {
  view = v;
  $('tab-learn').classList.toggle('on', v === 'home' || v === 'learn');
  $('tab-quiz').classList.toggle('on', v === 'setup' || v === 'quiz');
  $('home').classList.toggle('hidden', v !== 'home');
  $('learn').classList.toggle('hidden', v !== 'learn');
  $('quiz').classList.toggle('hidden', v !== 'setup' && v !== 'quiz');
  if (v === 'home') renderHome();
  if (v === 'learn') { topic = arg; current = null; filter.text = ''; renderLearn(); }
  if (v === 'setup') renderSetup();
  overall(); window.scrollTo(0, 0);
}

// ---------- home ----------
function renderHome() {
  const count = t => Q.filter(q => q.tier === t).length, step = { Core: 'Start here', Standard: 'Next', Niche: 'Only if needed' };
  $('home').innerHTML = `
    <div class="hero"><h1>Get ready for your QA interview</h1>
      <p>${Q.length} interview questions. Each one has a short answer to say out loud, a common trap, the full explanation and likely follow-ups. Pick a topic to read, or switch to <b>Quiz</b> to test yourself.</p></div>
    <div class="tiers">${Object.entries(TIERS).map(([t, d]) => `<div class="card">${tierBadge(t)} <span class="muted small">${count(t)} questions</span><b>${step[t]}</b><span class="muted small">${d}</span></div>`).join('')}</div>
    <div class="grid">${files.map(f => { const qs = Q.filter(q => q.file === f), k = qs.filter(known).length, c = qs.filter(q => q.tier === 'Core').length;
      return `<button class="card topic" onclick="go('learn','${f}')"><span class="ico">${fileMeta(f)[0]}</span><span class="name">${esc(fileMeta(f)[1])}</span>
        <span class="muted small">${qs.length} questions · ${c} Core</span><span class="meter"><i style="width:${100 * k / qs.length}%"></i></span>
        <span class="muted small">${k ? `${k} known` : 'Not started'}</span></button>`; }).join('')}</div>
    <div class="resetrow" id="resetrow">${resetRow(false)}</div>`;
}
// Reset is confirmed in the page: a browser confirm() dialog is blocked in some embedded viewers.
function resetRow(asking) {
  const k = Object.keys(store.known).length, c = Object.keys(store.code).length;
  if (!k && !c) return '<span class="muted small">Your progress is saved in this browser only.</span>';
  const what = [k && `${k} known mark${k > 1 ? 's' : ''}`, c && `${c} saved code edit${c > 1 ? 's' : ''}`].filter(Boolean).join(' and ');
  return asking
    ? `<span id="reset-ask">Delete ${what}? This cannot be undone.</span>
       <button class="btn miss" id="reset-yes" onclick="resetProgress()">Yes, reset</button>
       <button class="btn" id="reset-no" onclick="$('resetrow').innerHTML = resetRow(false)">Cancel</button>`
    : `<button class="btn small" id="reset-btn" onclick="$('resetrow').innerHTML = resetRow(true)">Reset my progress</button>`;
}
function resetProgress() { store = { known: {}, code: {} }; save(); overall(); renderHome(); }

// ---------- learn ----------
function learnList() {
  const s = filter.text.toLowerCase();
  return Q.filter(q => q.file === topic && (!filter.core || q.tier === 'Core') && (!s || q.q.toLowerCase().includes(s) || q.body.toLowerCase().includes(s)));
}
function renderSide() {
  const list = learnList(), cur = Q[current], secs = [...new Set(list.map(q => q.sec))];
  $('side-list').innerHTML = secs.map(sec => { const qs = list.filter(q => q.sec === sec), open = (cur && cur.sec === sec) || filter.text;
    return `<details ${open ? 'open' : ''}><summary>${inline(sec)}<span class="n">${qs.filter(known).length}/${qs.length}</span></summary>
      ${qs.map(q => `<div class="qlink ${q.i === current ? 'on' : ''}" onclick="pick(${q.i})"><span class="dot ${known(q) ? 'done' : ''}"></span><span>${inline(q.q)}</span></div>`).join('')}</details>`; }).join('')
    || '<p class="muted" style="padding:16px">No question matches.</p>';
}
function renderLearn() {
  const list = learnList();
  if (!list.some(q => q.i === current)) current = list[0] ? list[0].i : null;
  $('side').innerHTML = `<div class="side-head">
      <button class="back" onclick="go('home')">← All topics</button>
      <div class="side-title">${fileMeta(topic)[0]} ${esc(fileMeta(topic)[1])}</div>
      <input class="search" id="lsearch" type="search" placeholder="Search in this topic…" value="${esc(filter.text)}">
      <label class="switch"><input type="checkbox" id="lcore" ${filter.core ? 'checked' : ''}> Core questions only</label>
      <span class="muted small" style="line-height:1.4">${tierBadge('Core')} = most asked: in 30%+ of QA job ads, or set by hand.</span>
    </div><div id="side-list"></div>`;
  $('lsearch').oninput = e => { filter.text = e.target.value; refresh(); };
  $('lcore').onchange = e => { filter.core = e.target.checked; refresh(); };
  renderSide(); renderArticle();
}
function refresh() {  // re-filter without rebuilding the search box, so typing keeps focus
  const list = learnList();
  if (!list.some(q => q.i === current)) current = list[0] ? list[0].i : null;
  renderSide(); renderArticle();
}
function renderArticle() {
  if (current === null) { $('reader').innerHTML = '<div class="article muted">No question matches.</div>'; return; }
  const list = learnList(), q = Q[current], idx = list.indexOf(q), prev = list[idx - 1], next = list[idx + 1];
  $('reader').innerHTML = `<article class="article">${crumbs(q)}<h2>${inline(q.q)}</h2>${given(q)}${answer(q)}
    <div class="navrow">
      <button class="btn known-btn ${known(q) ? 'on' : ''}" onclick="toggleKnown()">${known(q) ? '✓ I know this' : 'Mark as known'}</button>
      <div class="grow"></div>
      <button class="btn" ${prev ? '' : 'disabled'} onclick="pick(${prev ? prev.i : ''})">← Previous</button>
      <button class="btn primary" ${next ? '' : 'disabled'} onclick="pick(${next ? next.i : ''})">Next →</button>
    </div><p class="muted small" style="text-align:right">Tip: the ← and → keys work too</p></article>`;
  $('reader').scrollTop = 0;
}
function pick(i) { current = i; renderSide(); renderArticle(); const el = $('side').querySelector('.qlink.on'); if (el) el.scrollIntoView({ block: 'nearest' }); }
function toggleKnown() { const q = Q[current]; if (known(q)) delete store.known[q.k]; else store.known[q.k] = 1; save(); overall(); renderSide(); renderArticle(); }

// ---------- quiz ----------
const qs = { topics: new Set(), tier: 'Core', size: 20, onlyNew: true };
let deck = [], pos = 0, shown = false, result = { hit: [], miss: [] };
function pool() {
  const tiers = { Core: ['Core'], Standard: ['Core', 'Standard'], All: ['Core', 'Standard', 'Niche'] }[qs.tier];
  return Q.filter(q => (!qs.topics.size || qs.topics.has(q.file)) && tiers.includes(q.tier) && (!qs.onlyNew || !known(q)));
}
function toggleTopic(f) { qs.topics.has(f) ? qs.topics.delete(f) : qs.topics.add(f); renderSetup(); }
function renderSetup() {
  const n = pool().length;
  $('quiz').innerHTML = `<div class="wrap"><div class="card setup">
    <h2>⚡ Quiz yourself</h2><p class="muted" style="margin:0">One question at a time. Say your answer out loud, reveal it, then be honest: did you know it?</p>
    <h3>Topics <span style="text-transform:none;letter-spacing:0;font-weight:400">(none selected means all)</span></h3>
    <div class="chips">${files.map(f => `<button class="chip ${qs.topics.has(f) ? 'on' : ''}" onclick="toggleTopic('${f}')">${fileMeta(f)[0]} ${esc(fileMeta(f)[1])}</button>`).join('')}</div>
    <h3>Which questions ${infoTiers()}</h3>
    <div class="chips">${[['Core', 'Core only (most asked)'], ['Standard', 'Core + Standard'], ['All', 'Everything']].map(([v, l]) => `<button class="chip ${qs.tier === v ? 'on' : ''}" onclick="qs.tier='${v}';renderSetup()">${l}</button>`).join('')}</div>
    <h3>How many</h3>
    <div class="chips">${[10, 20, 50, 0].map(v => `<button class="chip ${qs.size === v ? 'on' : ''}" onclick="qs.size=${v};renderSetup()">${v || 'All'}</button>`).join('')}</div>
    <h3>Options</h3>
    <label class="switch"><input type="checkbox" ${qs.onlyNew ? 'checked' : ''} onchange="qs.onlyNew=this.checked;renderSetup()"> Skip questions I already know</label>
    <div class="startrow"><button class="btn primary" ${n ? '' : 'disabled'} onclick="startQuiz()">Start ${Math.min(n, qs.size || n)} questions →</button>
      <span class="muted small">${n} match these settings</span></div></div></div>`;
}
function startQuiz(list) {
  deck = list ? list.slice() : pool();
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  if (!list && qs.size) deck = deck.slice(0, qs.size);
  pos = 0; shown = false; result = { hit: [], miss: [] }; view = 'quiz'; renderQuiz();
}
function renderQuiz() {
  if (pos >= deck.length) return renderSummary();
  const q = deck[pos];
  $('quiz').innerHTML = `<div class="qstage">
    <div class="qtop"><span>${pos + 1} / ${deck.length}</span><span class="meter"><i style="width:${100 * pos / deck.length}%"></i></span>
      <span>✅ ${result.hit.length} · 😕 ${result.miss.length}</span><button class="btn small" onclick="go('setup')">End</button></div>
    <div class="card qcard">${crumbs(q)}<h2>${inline(q.q)}</h2>${given(q)}
      ${shown ? answer(q) : `<div class="reveal"><p class="muted">Answer out loud first. Then check yourself.</p>
        <button class="btn primary" onclick="reveal()">Show answer <span class="kbd">Space</span></button></div>`}</div></div>
    ${shown ? `<div class="rate"><button class="btn miss" onclick="rate(false)">😕 Didn't know <span class="kbd">1</span></button>
      <button class="btn hit" onclick="rate(true)">✅ Knew it <span class="kbd">2</span></button></div>` : ''}`;
  window.scrollTo(0, 0);
}
function reveal() { shown = true; renderQuiz(); }
function rate(ok) {
  const q = deck[pos];
  if (ok) { store.known[q.k] = 1; result.hit.push(q); } else { delete store.known[q.k]; result.miss.push(q); }
  save(); overall(); pos++; shown = false; renderQuiz();
}
function renderSummary() {
  const h = result.hit.length, m = result.miss.length, pct = h + m ? Math.round(100 * h / (h + m)) : 0;
  $('quiz').innerHTML = `<div class="qstage"><div class="card summary">
    <div class="big">${pct >= 80 ? '🏆' : pct >= 50 ? '💪' : '📚'}</div><h2 style="margin:8px 0 0">Round finished</h2>
    <div class="stats3"><div><b>${h}</b><span class="muted">knew it</span></div><div><b>${m}</b><span class="muted">to review</span></div><div><b>${pct}%</b><span class="muted">score</span></div></div>
    ${m ? `<ul class="missed">${result.miss.map(q => `<li>😕 ${inline(q.q)}</li>`).join('')}</ul>` : ''}
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      ${m ? `<button class="btn primary" onclick="startQuiz(result.miss)">Repeat the ${m} I missed</button>` : ''}
      <button class="btn" onclick="go('setup')">New round</button></div></div></div>`;
}

// ---------- keys ----------
document.addEventListener('keydown', e => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  if (view === 'quiz' && pos < deck.length) {
    if (e.key === ' ' && !shown) { e.preventDefault(); reveal(); }
    if (shown && (e.key === '1' || e.key === '2')) rate(e.key === '2');
  }
  if (view === 'learn' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    const list = learnList(), n = list[list.findIndex(q => q.i === current) + (e.key === 'ArrowRight' ? 1 : -1)];
    if (n) pick(n.i);
  }
});
go('home');
</script>
</body>
</html>
